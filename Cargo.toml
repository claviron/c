[package]
name = "claviron-orbit-c"
version = "0.1.2"
edition = "2024"
rust-version = "1.98"
publish = false
autotests = false
license = "MIT OR Apache-2.0"
description = "C ABI for HTTP and message-session applications over Orbit Link"
repository = "https://github.com/claviron/c"

[workspace]
resolver = "3"

[lib]
name = "claviron_orbit"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
claviron = { version = "=0.2.2", default-features = false, features = ["orbit", "application"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
http = "1"
futures-util = "0.3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
